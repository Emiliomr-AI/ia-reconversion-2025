[project]
name = "ia-reconversion-2025"
version = "0.1.0"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '\.ipynb$|^notebooks/'

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["notebooks", "data", ".venv", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
